# docker-compose.yml
services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: core_transaccional_authorization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - findcard-net

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - findcard-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "findcard-kafka-cluster-01"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - findcard-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: findcard
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - findcard-net

  backend-core-transaction-authorization:
    build: .
    container_name: backend-core-transaction-authorization
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: core_transaccional_authorization
    ports:
      - "8082:8082"

  backend-audit:
    build: ../audit-notification
    container_name: backend-audit
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: audit_notification
    ports:
      - "8084:8084"

volumes:
  kafka-data:
  postgres-data:

networks:
  findcard-net: