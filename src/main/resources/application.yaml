spring:
  application:
    name: core-transaccional-authorization
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core_transaccional_authorization}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.request.per.connection: 5
        retries: 3
        delivery.timenout.ms: 10000
        spring.json.add.type.headers: false
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:changeme}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
  cache:
    type: redis
server:
  port: 8082

springdoc:
  api-docs:
    enable: true
    path: /api-docs
  swagger-ui:
    enable: true
    path: /swagger-ui


